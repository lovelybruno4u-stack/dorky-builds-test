{% extends "base.html" %}

{% block content %}
<!-- USER DASHBOARD SECTION -->
<section id="dashboard" class="py-12 md:py-24 min-h-[70vh] flex flex-col">
    <div class="mb-12 flex justify-between items-center w-full">
        <div>
            <h2 class="text-3xl font-bold text-white mb-2">> DASHBOARD.exe</h2>
            <p class="text-on-surface-variant text-lg">Manage your project allocations.</p>
        </div>
    </div>

    <!-- Logged In State -->
    <div class="w-full flex flex-col">
        <div class="brutalist-border border-l-4 border-l-primary bg-black p-6 mb-12 flex justify-between items-center flex-wrap gap-4">
            <div>
                <span class="text-on-surface-variant uppercase text-xs">AUTHORIZED_USER:</span>
                <span class="text-primary font-mono ml-2">{{ session.get('email') }}</span>
            </div>
        </div>

        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-bold text-white uppercase tracking-wider">> ACTIVE_PROJECTS</h3>
            <!-- Filters -->
            <div class="flex gap-2 text-sm">
                <button class="dash-filter active border border-surface-border px-3 py-1 hover:border-primary hover:text-primary transition-colors text-white" data-filter="all">[ ALL ]</button>
                <button class="dash-filter border border-surface-border px-3 py-1 hover:border-primary hover:text-primary transition-colors text-on-surface-variant" data-filter="active">[ IN_PROGRESS ]</button>
                <button class="dash-filter border border-surface-border px-3 py-1 hover:border-primary hover:text-primary transition-colors text-on-surface-variant" data-filter="completed">[ COMPLETED ]</button>
            </div>
        </div>

        <div id="orders-loading" class="text-primary font-mono animate-pulse p-4 text-center border-2 border-dashed border-surface-border">
            > FETCHING_RECORDS...
        </div>

        <!-- Orders Grid -->
        <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Dynamically populated -->
        </div>

        <div id="no-orders-msg" class="hidden brutalist-border bg-black p-8 text-center text-on-surface-variant my-8">
            <p class="mb-4">No active projects found under this identifier.</p>
            <a href="/services" class="inline-block text-primary hover:text-white uppercase text-sm border-b border-primary hover:border-white transition-colors">
                > INITIALIZE_NEW_PROJECT
            </a>
        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', () => {
    async function fetchUserOrders() {
        document.getElementById('orders-grid').classList.add('hidden');
        document.getElementById('no-orders-msg').classList.add('hidden');
        document.getElementById('orders-loading').classList.remove('hidden');

        try {
            const res = await fetch(`/api/orders`);
            const data = await res.json();

            document.getElementById('orders-loading').classList.add('hidden');

            if (data.status === 'success' && data.orders && data.orders.length > 0) {
                const grid = document.getElementById('orders-grid');
                grid.innerHTML = '';

                data.orders.forEach(order => {
                    const status = order.status || order.Status || 'REQUESTED';
                    const bookingId = order.booking_id || order['Booking ID'] || 'DB-UNKNOWN';
                    const projectName = order.project_type || order['Project Type'] || 'Custom Build';
                    const previewLink = order.preview_link || order['Preview Link'];
                    const paymentStatus = order.payment_status || order['Payment Status'] || 'PENDING';
                    const approved = order.approved || order.Approved || 'NO';

                    // Determine filter category
                    let filterClass = 'active'; // Default to active
                    if (status === 'DELIVERED') {
                        filterClass = 'completed';
                    }

                    // Progress Bar Logic
                    let progressPercent = 25;
                    let statusColor = 'text-primary';
                    if (status === 'IN_PROGRESS') { progressPercent = 50; statusColor = 'text-yellow-400'; }
                    else if (status === 'PREVIEW_READY') { progressPercent = 75; statusColor = 'text-blue-400'; }
                    else if (status === 'APPROVED') { progressPercent = 90; statusColor = 'text-purple-400'; }
                    else if (status === 'DELIVERED') { progressPercent = 100; statusColor = 'text-green-500'; }

                    let actionHtml = '';

                    // Action buttons based on status
                    if (status === 'PREVIEW_READY' && approved !== 'YES') {
                        actionHtml = `
                            <div class="mt-4 pt-4 border-t border-surface-border flex flex-col gap-2">
                                ${previewLink ? `<a href="${previewLink}" target="_blank" class="block w-full border border-primary text-primary hover:bg-primary hover:text-black font-bold py-2 text-center transition-colors uppercase tracking-widest text-xs">[ OPEN_FULL_PREVIEW ]</a>` : ''}
                                <button onclick="approveProject('${bookingId}', this)" class="block w-full bg-primary text-black font-bold py-2 text-center hover:bg-white transition-colors uppercase tracking-widest text-xs disabled:opacity-50">
                                    > APPROVE_PROJECT
                                </button>
                            </div>
                        `;
                    } else if (status === 'APPROVED') {
                        actionHtml = `
                            <div class="mt-4 pt-4 border-t border-surface-border flex flex-col gap-2">
                                <div class="bg-yellow-400/10 border border-yellow-400 text-yellow-400 p-2 text-xs text-center font-bold">
                                    PAYMENT REQUIRED TO UNLOCK FINAL DELIVERY
                                </div>
                            </div>
                        `;
                    } else if (status === 'DELIVERED' && paymentStatus === 'DONE') {
                        actionHtml = `
                            <div class="mt-4 pt-4 border-t border-surface-border flex flex-col gap-2">
                                <button class="block w-full bg-green-500 text-black font-bold py-2 text-center hover:bg-white transition-colors uppercase tracking-widest text-xs">
                                    > DOWNLOAD / ACCESS FINAL PROJECT
                                </button>
                            </div>
                        `;
                    } else if (previewLink) {
                        actionHtml = `
                            <div class="mt-4 pt-4 border-t border-surface-border flex flex-col gap-2">
                                <a href="${previewLink}" target="_blank" class="block w-full bg-surface-border text-white font-bold py-2 text-center hover:bg-white hover:text-black transition-colors uppercase tracking-widest text-xs">
                                    [ VIEW_PREVIEW ]
                                </a>
                            </div>
                        `;
                    }

                    const cardHtml = `
                        <div class="dash-card ${filterClass} brutalist-border bg-surface p-6 hover:border-primary transition-colors flex flex-col h-full relative group">

                            <h4 class="text-xl font-bold text-white mb-1 group-hover:text-primary transition-colors">${projectName}</h4>
                            <p class="font-mono text-sm text-on-surface-variant mb-4 pb-2 border-b border-surface-border">ID: ${bookingId}</p>

                            <div class="mb-4">
                                <div class="flex justify-between text-xs font-bold font-mono mb-1">
                                    <span class="text-on-surface-variant">STATUS</span>
                                    <span class="${statusColor}">${status}</span>
                                </div>
                                <div class="w-full h-1 bg-black border border-surface-border">
                                    <div class="h-full bg-primary transition-all duration-500" style="width: ${progressPercent}%; background-color: ${progressPercent === 100 ? '#22c55e' : (progressPercent === 75 ? '#60a5fa' : (progressPercent === 50 ? '#facc15' : '#00FF41'))}"></div>
                                </div>
                            </div>

                            <ul class="text-xs text-on-surface-variant space-y-2 mb-4 flex-grow font-mono">
                                <li>> PLAN: <span class="text-white">${order.plan || order.Plan || '-'}</span></li>
                                <li>> PAYMENT: <span class="text-yellow-400">${paymentStatus}</span></li>
                            </ul>

                            <a href="/track?id=${bookingId}" class="inline-block text-primary hover:text-white uppercase text-xs mb-2">
                                > FULL_TRACE_LOG
                            </a>

                            ${actionHtml}
                        </div>
                    `;
                    grid.innerHTML += cardHtml;
                });

                grid.classList.remove('hidden');
                setupFilters();
            } else {
                document.getElementById('no-orders-msg').classList.remove('hidden');
            }
        } catch (err) {
            console.error('Error fetching orders:', err);
            document.getElementById('orders-loading').classList.add('hidden');
            document.getElementById('no-orders-msg').innerHTML = '<p class="text-red-500">> ERR: FAILED_TO_FETCH_RECORDS</p>';
            document.getElementById('no-orders-msg').classList.remove('hidden');
        }
    }

    function setupFilters() {
        const filterBtns = document.querySelectorAll('.dash-filter');
        const dashCards = document.querySelectorAll('.dash-card');

        if (filterBtns.length > 0) {
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => {
                        b.classList.remove('active', 'text-white');
                        b.classList.add('text-on-surface-variant');
                    });

                    btn.classList.add('active', 'text-white');
                    btn.classList.remove('text-on-surface-variant');

                    const filterValue = btn.getAttribute('data-filter');

                    dashCards.forEach(card => {
                        if (filterValue === 'all' || card.classList.contains(filterValue)) {
                            card.style.display = 'flex';
                        } else {
                            card.style.display = 'none';
                        }
                    });
                });
            });
        }
    }

    window.approveProject = async function(bookingId, btnElement) {
        btnElement.disabled = true;
        const originalText = btnElement.innerHTML;
        btnElement.innerHTML = '> PROCESSING...';

        try {
            const response = await fetch(`/api/approve/${bookingId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({}) // Session handles auth now
            });

            const result = await response.json();
            if (result.status === 'success') {
                if(window.showToast) window.showToast("Approved successfully.", "success");
                setTimeout(() => {
                    fetchUserOrders(); // Refresh UI
                }, 1000);
            } else {
                if(window.showToast) window.showToast(result.message || "Failed to approve project.", "error");
                btnElement.disabled = false;
                btnElement.innerHTML = originalText;
            }
        } catch (err) {
            console.error(err);
            if(window.showToast) window.showToast("Error processing approval.", "error");
            btnElement.disabled = false;
            btnElement.innerHTML = originalText;
        }
    }

    // Call initially
    fetchUserOrders();
});
</script>
{% endblock %}
