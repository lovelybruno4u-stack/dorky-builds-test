{% extends "base.html" %}

{% block content %}
<!-- HERO -->
<section id="home" class="min-h-[80vh] flex flex-col justify-center border-b-2 border-surface-border pb-16 relative">
    <div class="brutalist-border bg-surface p-1 mb-8 max-w-fit">
        <div class="terminal-header">
            <div class="flex gap-2">
                <div class="terminal-dot" style="background:#ff5f56"></div>

                <span id="rotating-text" class="text-primary inline-block min-w-[300px]">SYSTEMS</span><span class="animate-pulse">_</span>

            <p class="text-on-surface-variant text-lg md:text-xl max-w-2xl mb-8 border-l-2 border-primary pl-4">
                Elite engineering for modern startups. Deconstruct the old, compile the new. Full-stack development, AI integrations, and brutal automation.
            </p>
            <div class="flex flex-wrap gap-4">
                <a href="/pricing" class="bg-primary text-black font-bold py-3 px-8 hover:bg-white transition-colors uppercase tracking-widest text-sm flex items-center gap-2">
                    > COMMIT_PROJECT
                </a>
                <a href="/services" class="border-2 border-surface-border text-white font-bold py-3 px-8 hover:border-primary hover:text-primary transition-colors uppercase tracking-widest text-sm flex items-center gap-2">
                    [ VIEW_SOURCE ]
                </a>
            </div>
        </div>
    </div>
</section>
